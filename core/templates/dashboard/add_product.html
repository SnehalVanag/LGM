{% extends 'dashboard/dashboard_base.html' %}
{% block title %}Add Product | Admin Dashboard{% endblock %}
{% block content %}
<div class="dashboard-header">Add Product</div>
<div class="card" style="max-width: 480px; margin: 0 auto; background: var(--charcoal); border-radius: 1.2rem; box-shadow: 0 2px 16px 0 rgba(16,185,129,0.07); border: 1.5px solid rgba(255,255,255,0.06); padding: 2rem 1.5rem;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_name" class="form-label">Product Name</label>
      {{ form.name }}
    </div>
    <div class="mb-3">
      <label for="id_image" class="form-label">Product Image</label>
      {{ form.image }}
    </div>
    <button type="submit" class="btn btn-success w-100" style="border-radius: 2rem; font-weight: 700;">Add Product</button>
  </form>
</div>
{% endblock %}

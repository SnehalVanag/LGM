{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>

/* Sidebar Styles */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  width: 240px;
  background: #18142b;
  box-shadow: 2px 0 12px 0 rgba(16,185,129,0.04);
  z-index: 200;
  display: flex;
  flex-direction: column;
  padding-top: 32px;
  transition: transform 0.18s cubic-bezier(.4,0,.2,1);
}

.sidebar-header {
  font-weight: 800;
  color: #fff;
  font-size: 2rem;
  padding: 0 1.5rem 2rem 1.5rem;
  letter-spacing: 1px;
  text-align: left;
}

.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  padding: 0 1.2rem;
}

.sidebar-link {
  color: #fff;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.9rem 1rem;
  border-radius: 0.7rem;
  transition: background 0.2s, color 0.2s;
  text-decoration: none;
  font-size: 1.08rem;
  position: relative;
}

.sidebar-link.active,
.sidebar-link:hover {
  background: linear-gradient(90deg, #23203a 60%, #2c2746 100%);
  color: #b6e2d3;
}

.sidebar-link i {
  font-size: 1.2rem;
  color: #b6e2d3;
  transition: color 0.2s;
}

.sidebar-link.active i,
.sidebar-link:hover i {
  color: #07e9cb;
}

.sidebar-toggler {
  display: none;
}

@media (max-width: 991px) {
  .sidebar { width: 200px; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); left: 0; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggler { display: block; position: fixed; top: 1.2rem; left: 1.2rem; }
  .main-content { margin-left: 0; }
}

/* Main Content Styles */
.main-content {
  margin-left: 240px;
  padding: 2.5rem 2rem 2rem 2rem;
  background: #fff;
  min-height: 100vh;
  transition: margin 0.18s cubic-bezier(.4,0,.2,1);
}

body, html {
  background: #fff;
  min-height: 100vh;
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
}
@media (max-width: 991px) {
  .sidebar { width: 220px; }
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); left: 0; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggler { display: block; position: fixed; top: 1.2rem; left: 1.2rem; }
  .main-content { margin-left: 0; }
}

    @media (max-width: 991px) {
      .kpi-cards { gap: 1rem; }
      .kpi-card { min-width: 140px; padding: 1rem 0.7rem; }
    }
    @media (max-width: 768px) {
      .kpi-cards {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }
      .kpi-card {
        width: 100%;
        min-width: 0;
        margin: 0 auto;
      }
    }
    @media (max-width: 576px) {
      .dashboard-header { font-size: 1.3rem; }
      .kpi-card { min-width: 100px; padding: 0.8rem 0.5rem; }
      .quick-actions, .activity-feed { padding: 0.8rem 0.5rem; }
      .chart-placeholder { font-size: 0.95rem; }
      .dashboard-chart { padding: 0.8rem 0.5rem; }
      .dashboard-chart canvas { height: 180px !important; }
    }
  </style>
  <!-- {% block extra_head %}{% endblock %} -->
</head>
<body >
  <button class="sidebar-toggler" id="sidebarToggler" style="background-color: #18142b"><i class="fa fa-bars"></i></button>
<nav class="sidebar" id="sidebarNav" >
  <div class="sidebar-header" style="background-color: #18142b">LGTM</div>
  <div class="sidebar-nav" style="background-color: #18142b">
    <!-- {% if request.user.profile.is_marketing %} -->
      <a class="sidebar-link {% if request.resolver_match.url_name == 'franchise_dashboard' %}active{% endif %}" href="{% url 'franchise_dashboard' %}"><i class="fa-solid fa-store"></i> Franchise</a>
      <a class="sidebar-link {% if request.resolver_match.url_name == 'marketing_dashboard' %}active{% endif %}" href="{% url 'marketing_dashboard' %}"><i class="fa-solid fa-bullhorn"></i> Marketing</a>
      <a class="sidebar-link" href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
    <!-- {% else %} -->
      <!-- Other roles/links here -->
      <a class="sidebar-link {% if request.resolver_match.url_name == 'franchise_dashboard' %}active{% endif %}" href="{% url 'franchise_dashboard' %}"><i class="fa-solid fa-store"></i> Franchise</a>
      <a class="sidebar-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}" href="{% url 'admin_dashboard' %}"><i class="fa-solid fa-user-shield"></i> Admin</a>
      <!-- <a class="sidebar-link {% if request.resolver_match.url_name == 'lead_dashboard' %}active{% endif %}" href="{% url 'lead_dashboard' %}"><i class="fa-solid fa-users"></i> Lead</a> -->
      <a class="sidebar-link {% if request.resolver_match.url_name == 'marketing_dashboard' %}active{% endif %}" href="{% url 'marketing_dashboard' %}"><i class="fa-solid fa-bullhorn"></i> Marketing</a>
      <a class="sidebar-link" href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
      <a class="sidebar-link" href="{% url 'admin_logout' %}"><i class="fa fa-sign-out-alt"></i> Logout</a>

    {% endif %}
  </div>
</nav>
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const sidebar = document.getElementById('sidebarNav');
    const toggler = document.getElementById('sidebarToggler');
    toggler.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
    // Close sidebar on nav link click (mobile)
    document.querySelectorAll('.sidebar-link').forEach(link => {
      link.addEventListener('click', () => {
        if(window.innerWidth <= 768) sidebar.classList.remove('open');
      });
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
